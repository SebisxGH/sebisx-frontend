<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEBISX.COM - Social Network & League Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 5px;
      font-size: 2.5rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #334155;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #0f172a;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      box-sizing: border-box;
      background-color: #0f172a;
      color: white;
    }

    button.primary-btn {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 15px;
    }

    button.primary-btn:hover {
      opacity: 0.9;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .status-ingame { background-color: #22c55e; color: black; }
    .status-offline { background-color: #64748b; color: white; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>SEBISX.COM</h1>
    <p style="color: var(--text-muted)">Comunidad Social & Estado de Invocadores en Tiempo Real</p>
  </header>

  <div class="container">

    <div class="card" id="auth-card">
      <div class="nav-tabs" id="tab-header">
        <button class="tab-btn active" onclick="switchTab('search')">Buscar</button>
        <button class="tab-btn" onclick="switchTab('login')">Ingresar</button>
        <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- Buscador -->
      <div id="tab-search">
        <h3>Buscar Invocador en Vivo</h3>
        <input type="text" id="search-name" placeholder="Nombre de Invocador (ej. Faker)" />
        <input type="text" id="search-tag" placeholder="Tag (ej. KR1)" />
        <button class="primary-btn" onclick="searchSummoner()">Buscar Estado</button>
        <div id="search-result" style="margin-top: 15px;"></div>
      </div>

      <!-- Login -->
      <div id="tab-login" class="hidden">
        <h3>Iniciar Sesión</h3>
        <input type="email" id="login-email" placeholder="Correo Electrónico" />
        <input type="password" id="login-password" placeholder="Contraseña" />
        <button class="primary-btn" onclick="handleLogin()">Entrar</button>
        <p id="login-msg" style="color: #ef4444; margin-top: 10px;"></p>
      </div>

      <!-- Registro -->
      <div id="tab-register" class="hidden">
        <h3>Crear Cuenta en SEBISX</h3>
        <input type="text" id="reg-username" placeholder="Nombre de Usuario" />
        <input type="email" id="reg-email" placeholder="Correo Electrónico" />
        <input type="password" id="reg-password" placeholder="Contraseña (mínimo 6 caracteres)" />
        <hr style="border-color: #334155; margin: 15px 0;" />
        <p style="font-size: 0.9rem; color: var(--text-muted);">Vincula tu cuenta de League of Legends:</p>
        <input type="text" id="reg-gamename" placeholder="Nombre en LoL (ej. Sebisx)" />
        <input type="text" id="reg-tagline" placeholder="Tagline en LoL (ej. LAS)" />
        <button class="primary-btn" onclick="handleRegister()">Registrarme</button>
        <p id="reg-msg" style="color: #ef4444; margin-top: 10px;"></p>
      </div>

      <!-- Perfil -->
      <div id="tab-profile" class="hidden">
        <div class="profile-header">
          <img id="user-icon" class="profile-icon" src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/profileicon/29.png" alt="Icono" />
          <div>
            <h2 id="user-display-name" style="margin: 0;"></h2>
            <p id="user-lol-id" style="margin: 5px 0; color: var(--text-muted);"></p>
            <span id="user-game-status" class="status-badge status-offline">Desconectado</span>
          </div>
        </div>
        <button class="primary-btn" onclick="handleLogout()" style="background-color: #ef4444; color: white;">Cerrar Sesión</button>
      </div>
    </div>

  </div>

  <script>
    const API_URL = 'https://sebisx-backend.onrender.com/api';

    function switchTab(tabName) {
      document.getElementById('tab-search').classList.add('hidden');
      document.getElementById('tab-login').classList.add('hidden');
      document.getElementById('tab-register').classList.add('hidden');
      document.getElementById('tab-profile').classList.add('hidden');

      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(t => t.classList.remove('active'));

      if(tabName === 'search') {
        document.getElementById('tab-search').classList.remove('hidden');
        tabs[0].classList.add('active');
      } else if(tabName === 'login') {
        document.getElementById('tab-login').classList.remove('hidden');
        tabs[1].classList.add('active');
      } else if(tabName === 'register') {
        document.getElementById('tab-register').classList.remove('hidden');
        tabs[2].classList.add('active');
      } else if(tabName === 'profile') {
        document.getElementById('tab-profile').classList.remove('hidden');
      }
    }

    async function searchSummoner() {
      const name = document.getElementById('search-name').value.trim();
      const tag = document.getElementById('search-tag').value.trim();
      const resDiv = document.getElementById('search-result');

      if (!name || !tag) {
        resDiv.innerHTML = '<p style="color: #ef4444;">Por favor completa ambos campos.</p>';
        return;
      }

      resDiv.innerHTML = '<p>Buscando datos...</p>';

      try {
        const res = await fetch(`${API_URL}/player/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`);
        const data = await res.json();

        if (res.ok) {
          const statusHTML = data.inGame 
            ? '<span class="status-badge status-ingame">🎮 ¡En Partida Ahora Mismo!</span>' 
            : '<span class="status-badge status-offline">No está en partida</span>';

          resDiv.innerHTML = `
            <div style="display:flex; align-items:center; gap: 10px; background: #0f172a; padding: 10px; border-radius: 8px;">
              <img src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/profileicon/${data.profileIconId}.png" style="width: 50px; border-radius: 50%;" />
              <div>
                <strong>${data.gameName} #${data.tagLine}</strong> (Nivel ${data.summonerLevel})<br/>
                ${statusHTML}
              </div>
            </div>
          `;
        } else {
          resDiv.innerHTML = `<p style="color: #ef4444;">${data.error || 'Jugador no encontrado'}</p>`;
        }
      } catch (err) {
        resDiv.innerHTML = '<p style="color: #ef4444;">Error al conectar con el servidor.</p>';
      }
    }

    async function handleRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const gameName = document.getElementById('reg-gamename').value.trim();
      const tagLine = document.getElementById('reg-tagline').value.trim();
      const msg = document.getElementById('reg-msg');

      msg.style.color = '#38bdf8';
      msg.innerText = 'Creando cuenta...';

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, username, gameName, tagLine })
        });
        const data = await res.json();

        if (res.ok) {
          alert('¡Registro exitoso! Ya puedes iniciar sesión.');
          msg.innerText = '';
          switchTab('login');
        } else {
          msg.style.color = '#ef4444';
          msg.innerText = data.error || 'Error al registrarse';
        }
      } catch (err) {
        msg.style.color = '#ef4444';
        msg.innerText = 'Error de conexión con el servidor.';
      }
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const msg = document.getElementById('login-msg');

      msg.style.color = '#38bdf8';
      msg.innerText = 'Iniciando sesión...';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('sebisx_session', JSON.stringify(data));
          loadUserProfile(data);
        } else {
          msg.style.color = '#ef4444';
          msg.innerText = data.error || 'Credenciales incorrectas';
        }
      } catch (err) {
        msg.style.color = '#ef4444';
        msg.innerText = 'Error de conexión con el servidor.';
      }
    }

    async function loadUserProfile(authData) {
      document.getElementById('tab-header').classList.add('hidden');
      switchTab('profile');

      const profile = authData.profile;
      document.getElementById('user-display-name').innerText = `@${profile.username}`;
      document.getElementById('user-lol-id').innerText = `${profile.game_name} #${profile.tag_line}`;

      try {
        const res = await fetch(`${API_URL}/player/${encodeURIComponent(profile.game_name)}/${encodeURIComponent(profile.tag_line)}`);
        const lolData = await res.json();
        if (res.ok) {
          document.getElementById('user-icon').src = `https://ddragon.leagueoflegends.com/cdn/14.1.1/img/profileicon/${lolData.profileIconId}.png`;
          const statusBadge = document.getElementById('user-game-status');
          if (lolData.inGame) {
            statusBadge.className = 'status-badge status-ingame';
            statusBadge.innerText = '🎮 Jugando una partida';
          } else {
            statusBadge.className = 'status-badge status-offline';
            statusBadge.innerText = 'Fuera de partida';
          }
        }
      } catch (e) {
        console.log('Error al cargar perfil de LoL');
      }
    }

    function handleLogout() {
      localStorage.removeItem('sebisx_session');
      document.getElementById('tab-header').classList.remove('hidden');
      switchTab('login');
    }

    window.onload = () => {
      const savedSession = localStorage.getItem('sebisx_session');
      if (savedSession) {
        loadUserProfile(JSON.parse(savedSession));
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarjeta de Invocador</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0c0f17;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Contenedor principal de la tarjeta */
    .profile-card {
      position: relative;
      width: 100%;
      max-width: 850px;
      height: 320px;
      border-radius: 16px;
      overflow: hidden;
      background-color: #121624;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Imagen de portada de fondo */
    .banner-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.65);
      z-index: 1;
    }

    /* Capa oscura superpuesta para legibilidad */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(12, 15, 23, 0.2) 0%, rgba(12, 15, 23, 0.85) 100%);
      z-index: 2;
    }

    /* Botón cambiar portada */
    .btn-change-cover {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(18, 22, 36, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-change-cover:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Contenido inferior */
    .card-content {
      position: relative;
      z-index: 5;
      padding: 24px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* Sección de perfil e invocador */
    .summoner-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      flex-shrink: 0;
    }

    .profile-icon {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid #121624;
    }

    .user-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summoner-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #a855f7;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .summoner-name-container {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .summoner-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .summoner-tag {
      font-size: 1.8rem;
      font-weight: 800;
      color: #a855f7;
    }

    /* Contenedor de rangos */
    .ranks-container {
      display: flex;
      gap: 16px;
    }

    .rank-card-box {
      background: rgba(18, 22, 36, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 160px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .rank-card-box.soloq {
      border: 1px solid rgba(168, 85, 247, 0.4);
      box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.1);
    }

    .rank-card-box.flex {
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.1);
    }

    .rank-card-box:hover {
      transform: translateY(-2px);
    }

    .rank-img-badge {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.2));
    }

    .rank-queue-title {
      display: block;
      font-size: 0.7rem;
      font-weight: 800;
      color: #06b6d4;
      letter-spacing: 1px;
    }

    .rank-card-box.soloq .rank-queue-title {
      color: #a855f7;
    }

    .rank-tier-text {
      display: block;
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .rank-lp-text {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Imagen de fondo/portada (Arcane Jinx) -->
    <img src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Jinx_37.jpg" alt="Portada Jinx" class="banner-bg" />
    <div class="overlay"></div>

    <!-- Botón cambiar portada -->
    <button class="btn-change-cover">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      Cambiar Portada
    </button>

    <!-- Contenido -->
    <div class="card-content">
      <!-- Datos del Invocador -->
      <div class="summoner-info">
        <div class="icon-wrapper">
          <img src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/profileicon/538.png" alt="Icono de Invocador" class="profile-icon" />
        </div>
        <div class="user-details">
          <span class="summoner-label">Invocador</span>
          <div class="summoner-name-container">
            <h1 class="summoner-name" id="summoner-name">Sebisx</h1>
            <span class="summoner-tag" id="summoner-tag">#Faker</span>
          </div>
        </div>
      </div>

      <!-- Rangos (SoloQ y Flex) -->
      <div class="ranks-container" id="ranks-container">
        <!-- Renderizado dinámico vía JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // URLs desde jsDelivr CDN (Riot Games Developer Assets)
    // Resuelve el problema de CORS y hotlink que causa el fallback 'S'
    const RANK_ICONS = {
      IRON: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Iron.png',
      BRONZE: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Bronze.png',
      SILVER: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Silver.png',
      GOLD: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Gold.png',
      PLATINUM: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Platinum.png',
      EMERALD: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Emerald.png',
      DIAMOND: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Diamond.png',
      MASTER: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Master.png',
      GRANDMASTER: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Grandmaster.png',
      CHALLENGER: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Challenger.png',
      UNRANKED: 'https://cdn.jsdelivr.net/gh/RiotGames/developer-relations/assets/ranked-emblems/Unranked.png'
    };

    const RANK_COLORS = {
      IRON: '#8c8882',
      BRONZE: '#a97142',
      SILVER: '#8098a7',
      GOLD: '#e0a943',
      PLATINUM: '#43a089',
      EMERALD: '#2cc081',
      DIAMOND: '#5181e0',
      MASTER: '#9d5be3',
      GRANDMASTER: '#cd4646',
      CHALLENGER: '#38b2ac',
      UNRANKED: '#64748b'
    };

    // Datos simulados de la API de Riot
    const mockDataSoloQ = {
      tier: 'SILVER',
      rank: 'I',
      leaguePoints: 75
    };

    const mockDataFlex = {
      tier: 'SILVER',
      rank: 'II',
      leaguePoints: 66
    };

    function renderRankBadges(solo, flex) {
      const container = document.getElementById('ranks-container');
      if (!container) return;

      const formatCard = (data, queueName, typeClass) => {
        let tierText = 'UNRANKED';
        let lpText = '';
        let tierKey = 'UNRANKED';

        if (data && data.tier) {
          tierKey = data.tier.toUpperCase();
          const rankVal = data.rank || '';
          tierText = `${tierKey} ${rankVal}`.trim();
          const lp = data.leaguePoints !== undefined ? data.leaguePoints : data.lp;
          lpText = lp !== undefined ? `${lp} LP` : '';
        }

        const iconUrl = RANK_ICONS[tierKey] || RANK_ICONS.UNRANKED;
        const badgeColor = RANK_COLORS[tierKey] || RANK_COLORS.UNRANKED;

        return `
          <div class="rank-card-box ${typeClass}">
            <img class="rank-img-badge" 
                 src="${iconUrl}" 
                 alt="${tierText}" 
                 referrerpolicy="no-referrer"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="rank-fallback-avatar" style="display:none; width:44px; height:44px; border-radius:50%; background:${badgeColor}; color:#fff; font-weight:bold; align-items:center; justify-content:center; font-size:1.1rem; box-shadow: 0 0 10px ${badgeColor}80;">
              ${tierKey.charAt(0)}
            </div>
            <div>
              <span class="rank-queue-title">${queueName}</span>
              <span class="rank-tier-text">${tierText}</span>
              ${lpText ? `<span class="rank-lp-text">${lpText}</span>` : ''}
            </div>
          </div>
        `;
      };

      container.innerHTML = formatCard(solo, 'SOLOQ', 'soloq') + formatCard(flex, 'FLEX', 'flex');
    }

    // Inicializar renderizado al cargar
    document.addEventListener('DOMContentLoaded', () => {
      renderRankBadges(mockDataSoloQ, mockDataFlex);
    });
  </script>
</body>
</html>
